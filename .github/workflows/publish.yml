name: Publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:1.0.7
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Smoke test the image
        run: |
          docker run -d --name rbx -p 8099:8080 "${{ env.IMAGE }}:${{ github.sha }}"
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8099/api/recipebox/info >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8099/api/recipebox/info
          echo
          curl -fsS http://127.0.0.1:8099/ | grep -q "Recipe Box"
          echo "PWA index served"
          # The import proxy must exist and reject non-http(s) targets.
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8099/api/recipebox/fetch?url=notaurl")
          echo "fetch route answered $code"
          test "$code" = "400"
          docker rm -f rbx
